apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: teamboard }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: teamboard-backend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: mongo-secret, key: MONGO_INITDB_ROOT_USERNAME } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-secret, key: MONGO_INITDB_ROOT_PASSWORD } }
            - name: MONGO_HOST
              value: mongo
          readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: teamboard }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 3000 }]